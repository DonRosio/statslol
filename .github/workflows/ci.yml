name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run (Monday morning), so a vulnerability disclosed in an existing
    # dependency makes the audit fail even when nobody pushes.
    - cron: '17 6 * * 1'

# Least privilege: the jobs only read the code, and no secret is used.
permissions:
  contents: read

# A new push to the same branch cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, typecheck, test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to a full commit SHA: unlike a tag, it cannot be moved
      # to point at malicious code. Dependabot keeps the SHA and comment up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the GitHub token in the git config for the next steps.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Corepack installs the pnpm version pinned in package.json and verifies its hash.
      - run: corepack enable
      # Fails if pnpm-lock.yaml does not match package.json.
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      # Checks pnpm-lock.yaml against known advisories: no install needed.
      - run: pnpm audit

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit, not only the last one: also catches secrets committed
          # with --no-verify, which skips the local pre-commit hook.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # --redact: workflow logs are readable by anyone with access to the repo.
      - run: gitleaks git --config .gitleaks.toml --redact --verbose --no-banner
