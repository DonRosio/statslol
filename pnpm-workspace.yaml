packages:
  - apps/*
  - packages/*

# Supply-chain hardening. pnpm 12 already blocks dependency install scripts
# (strictDepBuilds) and git/tarball sources in transitive deps (blockExoticSubdeps).

# Only install versions published at least 3 days ago: malicious releases are
# usually detected and pulled within hours. Setting it explicitly also makes it
# strict (install fails instead of silently picking a too-recent version).
minimumReleaseAge: 4320

# Fail if a package is published with weaker trust evidence than before
# (e.g. it used to be published from CI with provenance and suddenly is not):
# a typical sign of a hijacked maintainer account.
trustPolicy: no-downgrade

# Install scripts of dependencies, reviewed one by one (pnpm refuses to install while
# a dependency with an install script is not listed here).
allowBuilds:
  # Its script only checks its native binary and swaps a launcher for speed: the
  # JavaScript API used by drizzle-kit works without it.
  esbuild: false

overrides:
  # drizzle-kit 0.31 bundles the code it needs from tsx, but still lists these two
  # packages, which it never loads. Removing them drops two extra versions of esbuild,
  # one of them (0.18) with a known vulnerability (GHSA-67mh-4wv8-2f99).
  'drizzle-kit@0.31>@esbuild-kit/esm-loader': '-'
  'drizzle-kit@0.31>tsx': '-'

# Versions of the dependencies used by several packages: their package.json says
# "catalog:" instead of a version, so the whole monorepo always uses the same one.
catalog:
  msw: ^3.0.1
  zod: ^4.6.5
