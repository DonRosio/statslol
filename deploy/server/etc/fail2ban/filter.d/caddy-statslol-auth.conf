# Fail2ban filter: a request that basic_auth refused (401) on statslol.donrgames.fr, in the
# access log Caddy writes for that site (/var/log/caddy/statslol-access.log, statslol.caddy):
# one JSON line per request.
#
# Only fields that Caddy itself writes are matched. Everything the client sends (the URI, the
# headers) lands inside JSON strings, where every quote is escaped (\"): no request can
# imitate `"remote_ip":"…"` or `"status":401,` to have someone else banned.
#
# Try it on the server: sudo fail2ban-regex /var/log/caddy/statslol-access.log caddy-statslol-auth

[Definition]

failregex = "logger":"http\.log\.access\.[^"]*","msg":"handled request","request":\{"remote_ip":"<ADDR>",.*\},"bytes_read":\d+,"user_id":"(?:[^"\\]|\\.)*","duration":[^,]+,"size":\d+,"status":401,

ignoreregex =

# "ts": seconds since 1970, with a fraction (fail2ban takes the date out of the line before it
# applies failregex, which therefore starts after it).
datepattern = "ts":{EPOCH}
